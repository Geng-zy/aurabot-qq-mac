name: PR Check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

# 这个工作流只服务 main、版本 tag 与 PR：不引入环境、部署或第三方状态。
# 生成产物（client.js、全仓清单）必须与源码一致；Release 的摘要必须与本仓记录一致。

concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Inventory has no unreviewed files
        run: node scripts/repo-inventory.mjs --write
      - name: Inventory artifact is up to date
        run: |
          # --write 只保证「待审为 0」；提交上来的清单本身过期时它会就地改写、然后照常退出 0。
          # 这里比对一次，过期就红：docs/REPO-INVENTORY.md 在发布物里，不许和源码漂移。
          if ! git diff --exit-code -- docs/REPO-INVENTORY.md; then
            echo "::error::docs/REPO-INVENTORY.md 与源码不一致：本地跑 npm run inventory 并提交这份清单"
            exit 1
          fi
      - name: Install dev tooling
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax check
        run: npm run check
      - name: Independent lint
        run: npm run lint
      - name: Client build is in sync
        run: |
          npm run build:client
          git diff --exit-code -- client/client.js
      - name: Pack artifact
        run: npm pack --silent
      - name: Verify npm pack layout
        run: |
          tgz=$(ls dsh-aurabot-qq-*.tgz | head -n 1)
          test -n "$tgz"
          tar -tzf "$tgz" | grep -qx 'package/src/host.js'
          tar -tzf "$tgz" | grep -qx 'package/client/client.js'
          tar -tzf "$tgz" | grep -qx 'package/package.json'
      - name: Run tests
        run: npm test

  ui-smoke:
    name: ui-smoke (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install dev tooling
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install playwright-core and Chromium
        run: |
          # 预览服务要 React 18 UMD（不走 CDN，CI 里也要能离线复现）
          npm install --no-save --no-audit --no-fund playwright-core@1 react@18 react-dom@18
          # 只用 playwright-core 自己的 CLI 装浏览器：以前是 `npx playwright@1 install`，
          # 两个包各自解析 @1 的版本，跨一次发布窗口就会出现「core 期望 chromium-1223、
          # 实际装的是 1255」这种错位（审查 M3）。一个版本源就不会错。
          node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Build client bundle
        run: npm run build:client
      - name: UI smoke (representative pages, no baseline writes)
        env:
          UI_SHOT_CHANNEL: chromium
        run: node scripts/ui-shot.mjs --pages=overview,persona,mindsettings,modules --states=0 --out=/tmp/ui-smoke

  release-check:
    name: release-check (tag)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Does this tag have a Release yet?
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # tag 先推、Release 后建是常态：没有 Release 时只提示，不要让 CI 变红
          if gh release view "$GITHUB_REF_NAME" --json tagName >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::${GITHUB_REF_NAME} 还没有 Release，跳过摘要校验（建完 Release 可手动重跑）"
          fi
      - name: Verify release assets match repo records
        if: steps.rel.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-release.mjs
