name: PR Check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

# 这个工作流只服务 main、版本 tag 与 PR：不引入环境、部署或第三方状态。
# 生成产物（client.js、全仓清单）必须与源码一致；Release 的摘要必须与本仓记录一致。

concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Inventory has no unreviewed files
        run: node scripts/repo-inventory.mjs --write
      - name: Install dev tooling
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax check
        run: npm run check
      - name: Independent lint
        run: npm run lint
      - name: Client build is in sync
        run: |
          npm run build:client
          git diff --exit-code -- client/client.js
      - name: Pack artifact
        run: npm pack --silent
      - name: Verify npm pack layout
        run: |
          tgz=$(ls dsh-aurabot-qq-*.tgz | head -n 1)
          test -n "$tgz"
          tar -tzf "$tgz" | grep -qx 'package/src/host.js'
          tar -tzf "$tgz" | grep -qx 'package/client/client.js'
          tar -tzf "$tgz" | grep -qx 'package/package.json'
      - name: Run tests
        run: npm test

  ui-smoke:
    name: ui-smoke (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dev tooling
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install playwright-core and Chromium
        run: |
          # 预览服务要 React 18 UMD（不走 CDN，CI 里也要能离线复现）
          npm install --no-save --no-audit --no-fund playwright-core@1 react@18 react-dom@18
          npx --yes playwright@1 install --with-deps chromium
      - name: Build client bundle
        run: npm run build:client
      - name: UI smoke (representative pages, no baseline writes)
        env:
          UI_SHOT_CHANNEL: chromium
        run: node scripts/ui-shot.mjs --pages=overview,persona,mindsettings,modules --states=0 --out=/tmp/ui-smoke

  release-check:
    name: release-check (tag)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify release assets match repo records
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-release.mjs
