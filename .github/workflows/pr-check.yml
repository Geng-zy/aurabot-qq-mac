name: PR Check

on:
  pull_request:
    branches:
      - main
      - beta/v1.5.10
  push:
    branches:
      - main
      - beta/v1.5.10
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dev tooling
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax check
        run: npm run check
      - name: Independent lint
        run: npm run lint
      - name: Pack artifact
        run: npm pack --silent
      - name: Verify npm pack layout
        run: |
          tgz=$(ls dsh-aurabot-qq-*.tgz | head -n 1)
          test -n "$tgz"
          tar -tzf "$tgz" | grep -qx 'package/src/host.js'
          tar -tzf "$tgz" | grep -qx 'package/client/client.js'
          tar -tzf "$tgz" | grep -qx 'package/package.json'
      - name: Run tests
        run: npm test
