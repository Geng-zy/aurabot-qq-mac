<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="Aurabot for macOS 的结构：QQ、OrbStack 里的 SnowLuma、Aurabot 插件、DeepSeek Harness、翻唱环境">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5b6b6b"/>
    </marker>
    <marker id="arrw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#d9822b"/>
    </marker>
  </defs>
  <rect width="1200" height="440" rx="18" fill="#f7f5f0"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',Arial,sans-serif">
    <text x="40" y="48" fill="#1f3a3d" font-size="22" font-weight="700">在一台 Mac 上怎么跑起来</text>
    <text x="40" y="74" fill="#6b7575" font-size="14">全部在本机：QQ 网关在 OrbStack 容器里，插件、心智核心和翻唱环境在 macOS 上（Python 共用 ~/Aurabot/mind）</text>

    <!-- QQ -->
    <rect x="40" y="120" width="150" height="96" rx="14" fill="#ffffff" stroke="#c9d6d6"/>
    <text x="115" y="160" text-anchor="middle" fill="#1f3a3d" font-size="18" font-weight="700">QQ</text>
    <text x="115" y="186" text-anchor="middle" fill="#6b7575" font-size="13">机器人小号</text>

    <!-- OrbStack container -->
    <rect x="250" y="104" width="250" height="128" rx="14" fill="#e6f1f0" stroke="#7fb3ae" stroke-dasharray="6 5"/>
    <text x="268" y="128" fill="#3f7f79" font-size="12">OrbStack / Docker 容器</text>
    <rect x="270" y="140" width="210" height="72" rx="12" fill="#ffffff" stroke="#7fb3ae"/>
    <text x="375" y="172" text-anchor="middle" fill="#1f3a3d" font-size="17" font-weight="700">SnowLuma</text>
    <text x="375" y="196" text-anchor="middle" fill="#6b7575" font-size="13">OneBot v11 网关（官方镜像）</text>

    <!-- Plugin -->
    <rect x="580" y="104" width="300" height="128" rx="14" fill="#fff4e6" stroke="#e0a560"/>
    <text x="598" y="128" fill="#b0702a" font-size="12">DeepSeek Harness 插件</text>
    <text x="730" y="168" text-anchor="middle" fill="#1f3a3d" font-size="20" font-weight="800">Aurabot for macOS</text>
    <text x="730" y="194" text-anchor="middle" fill="#6b7575" font-size="13">心智核心 · 语音 · 表情 · 模块</text>
    <text x="730" y="214" text-anchor="middle" fill="#6b7575" font-size="13">系统语音兜底（say）</text>

    <!-- DSH -->
    <rect x="950" y="120" width="210" height="96" rx="14" fill="#ffffff" stroke="#c9d6d6"/>
    <text x="1055" y="160" text-anchor="middle" fill="#1f3a3d" font-size="17" font-weight="700">DSH 会话</text>
    <text x="1055" y="186" text-anchor="middle" fill="#6b7575" font-size="13">模型、工具、审批</text>

    <!-- arrows top row -->
    <path d="M192 168H246" stroke="#5b6b6b" stroke-width="2" marker-end="url(#arr)" marker-start="url(#arr)"/>
    <path d="M502 160H576" stroke="#5b6b6b" stroke-width="2" marker-end="url(#arr)" marker-start="url(#arr)"/>
    <text x="539" y="150" text-anchor="middle" fill="#5b6b6b" font-size="12">WebSocket</text>
    <path d="M882 168H946" stroke="#5b6b6b" stroke-width="2" marker-end="url(#arr)" marker-start="url(#arr)"/>

    <!-- relay arrow -->
    <path d="M640 234C640 268 470 268 420 236" fill="none" stroke="#d9822b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrw)"/>
    <text x="532" y="284" text-anchor="middle" fill="#b0702a" font-size="12">大于 30 MB 的文件：本机下载口（host.docker.internal，随机口令）</text>

    <!-- song env -->
    <rect x="580" y="304" width="580" height="108" rx="14" fill="#ffffff" stroke="#c9d6d6"/>
    <text x="600" y="330" fill="#1f3a3d" font-size="15" font-weight="700">~/Aurabot/rvc（一键安装，版本固定）</text>
    <g font-size="13" fill="#4a5555">
      <rect x="600" y="344" width="168" height="52" rx="10" fill="#f2f7f6"/>
      <text x="684" y="366" text-anchor="middle" font-weight="600">Applio/.venv</text>
      <text x="684" y="386" text-anchor="middle" fill="#6b7575">换声 · torch 2.11</text>
      <rect x="780" y="344" width="168" height="52" rx="10" fill="#f2f7f6"/>
      <text x="864" y="366" text-anchor="middle" font-weight="600">env/</text>
      <text x="864" y="386" text-anchor="middle" fill="#6b7575">人声分离 · torch 2.15</text>
      <rect x="960" y="344" width="182" height="52" rx="10" fill="#f2f7f6"/>
      <text x="1051" y="366" text-anchor="middle" font-weight="600">bin/</text>
      <text x="1051" y="386" text-anchor="middle" fill="#6b7575">ffmpeg · rubberband</text>
    </g>
    <path d="M820 234V300" stroke="#5b6b6b" stroke-width="2" marker-end="url(#arr)"/>
    <text x="830" y="272" fill="#5b6b6b" font-size="12">翻唱</text>

    <!-- legend -->
    <text x="40" y="400" fill="#6b7575" font-size="12">Apple 芯片用 MPS 加速；Intel Mac 只能用 CPU，翻唱会很慢</text>
  </g>
</svg>
