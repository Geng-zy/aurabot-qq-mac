<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Aurabot 心智核心：让 QQ 里的她只有一个心智——会遗忘的记忆、会消退的情绪、会困会饿的身体、慢慢变的性格">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a2b"/>
      <stop offset="0.55" stop-color="#1b2a44"/>
      <stop offset="1" stop-color="#2b2350"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#ffb46b" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffb46b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.15" cy="0.9" r="0.5">
      <stop offset="0" stop-color="#7cc6ff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#7cc6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd08a"/>
      <stop offset="1" stop-color="#ff8f7a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf9f5"/>
      <stop offset="1" stop-color="#efebe3"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1280" height="400" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="20" fill="url(#glow)"/>
  <rect width="1280" height="400" rx="20" fill="url(#glow2)"/>
  <!-- 神经元一样的点和连线 -->
  <g stroke="#9fb6ff" stroke-opacity="0.13" stroke-width="1" fill="none">
    <path d="M40 330L130 270L230 310L330 250M130 270L170 190L260 160M230 310L300 360M560 40L640 90L720 60M640 90L610 160"/>
  </g>
  <g fill="#bcd0ff" fill-opacity="0.28">
    <circle cx="40" cy="330" r="3"/><circle cx="130" cy="270" r="4"/><circle cx="230" cy="310" r="3"/><circle cx="330" cy="250" r="3"/>
    <circle cx="170" cy="190" r="3"/><circle cx="260" cy="160" r="2.5"/><circle cx="300" cy="360" r="2.5"/>
    <circle cx="560" cy="40" r="2.5"/><circle cx="640" cy="90" r="3.5"/><circle cx="720" cy="60" r="2.5"/><circle cx="610" cy="160" r="2.5"/>
  </g>

  <!-- 左侧文字 -->
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',Arial,sans-serif">
    <text x="64" y="86" fill="#ffd08a" font-size="16" font-weight="600" letter-spacing="3">AURABOT · 心智核心</text>
    <text x="62" y="148" fill="#ffffff" font-size="54" font-weight="800">她不是在扮演，</text>
    <text x="62" y="212" fill="url(#accent)" font-size="54" font-weight="800">她只有一个心智。</text>
    <text x="66" y="256" fill="#c9d4ec" font-size="18">记忆会淡、情绪会过去、累了会困、性格被日子慢慢塑造——每天都是同一个她。</text>
    <g transform="translate(66,286)" font-size="14">
      <rect width="118" height="32" rx="16" fill="#ffffff" fill-opacity="0.07" stroke="#ffd08a" stroke-opacity="0.45"/>
      <text x="59" y="21" text-anchor="middle" fill="#ffe3bf">会遗忘的记忆</text>
      <rect x="130" width="104" height="32" rx="16" fill="#ffffff" fill-opacity="0.07" stroke="#ffd08a" stroke-opacity="0.45"/>
      <text x="182" y="21" text-anchor="middle" fill="#ffe3bf">66 种情绪</text>
      <rect x="246" width="118" height="32" rx="16" fill="#ffffff" fill-opacity="0.07" stroke="#ffd08a" stroke-opacity="0.45"/>
      <text x="305" y="21" text-anchor="middle" fill="#ffe3bf">会困会饿会睡</text>
      <rect x="376" width="118" height="32" rx="16" fill="#ffffff" fill-opacity="0.07" stroke="#ffd08a" stroke-opacity="0.45"/>
      <text x="435" y="21" text-anchor="middle" fill="#ffe3bf">19 项性格慢慢变</text>
      <rect y="42" width="132" height="32" rx="16" fill="#ffffff" fill-opacity="0.07" stroke="#9fc4ff" stroke-opacity="0.45"/>
      <text x="66" y="63" text-anchor="middle" fill="#d8e6ff">闲着时自己在想</text>
      <rect x="144" y="42" width="146" height="32" rx="16" fill="#ffffff" fill-opacity="0.07" stroke="#9fc4ff" stroke-opacity="0.45"/>
      <text x="217" y="63" text-anchor="middle" fill="#d8e6ff">按 QQ 号记每段关系</text>
      <rect x="302" y="42" width="192" height="32" rx="16" fill="#ffffff" fill-opacity="0.07" stroke="#9fc4ff" stroke-opacity="0.45"/>
      <text x="398" y="63" text-anchor="middle" fill="#d8e6ff">所有参数都有研究出处</text>
    </g>
  </g>

  <!-- 右侧：「她现在」卡片 -->
  <g transform="translate(800,44)" filter="url(#shadow)" font-family="-apple-system,'PingFang SC',sans-serif">
    <rect width="420" height="312" rx="16" fill="url(#card)"/>
    <text x="24" y="38" fill="#2b2350" font-size="17" font-weight="700">她现在</text>
    <text x="396" y="38" text-anchor="end" fill="#8a857a" font-size="12">23:47 · 上海</text>
    <g font-size="13" fill="#4a4740">
      <text x="24" y="70">精力</text>
      <rect x="70" y="60" width="300" height="10" rx="5" fill="#e3ded3"/>
      <rect x="70" y="60" width="96" height="10" rx="5" fill="#e0a560"/>
      <text x="24" y="94">困</text>
      <rect x="70" y="84" width="300" height="10" rx="5" fill="#e3ded3"/>
      <rect x="70" y="84" width="231" height="10" rx="5" fill="#7a6fd0"/>
      <text x="24" y="118">饿</text>
      <rect x="70" y="108" width="300" height="10" rx="5" fill="#e3ded3"/>
      <rect x="70" y="108" width="54" height="10" rx="5" fill="#5fae9a"/>
    </g>
    <line x1="24" y1="136" x2="396" y2="136" stroke="#e0dbd0"/>
    <g font-size="13">
      <text x="24" y="160" fill="#8a857a">心情</text>
      <text x="70" y="160" fill="#2b2a26">有点低落，又舍不得睡</text>
      <text x="24" y="186" fill="#8a857a">感受</text>
      <text x="70" y="186" fill="#2b2a26">对主人有些想念（6 小时没说话）</text>
      <text x="70" y="206" fill="#2b2a26">一点委屈（被群友说唱歌跑调）</text>
      <text x="24" y="232" fill="#8a857a">在想</text>
      <text x="70" y="232" fill="#2b2a26">「明天要不要把那首歌再练一遍……」</text>
      <text x="24" y="258" fill="#8a857a">想起</text>
      <text x="70" y="258" fill="#2b2a26">好像主人说过不吃香菜（记得大概）</text>
    </g>
    <rect x="24" y="274" width="372" height="24" rx="12" fill="#2b2350" fill-opacity="0.07"/>
    <text x="210" y="291" text-anchor="middle" fill="#5b5490" font-size="12">再过一会儿就困得去睡了 · 睡觉时整理今天的记忆、做梦</text>
  </g>
</svg>
